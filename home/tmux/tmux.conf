set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Start window ordering at 1.
set -g base-index 1

# Use Vi keybindings in copy-mode.
setw -g mode-keys vi

# Sync yanked text to clipboard.
set -g set-clipboard on
set -g allow-passthrough on

# Vi visual selection and yank bindings.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @tmux2k-left-plugins "session cwd"
set -g @tmux2k-right-plugins "cpu ram battery time"

set -g @tmux2k-theme 'catppuccin'
set -g @tmux2k-black '#1e1e2e'
set -g @tmux2k-gray '#313244'
set -g @tmux2k-white '#cdd6f4'
set -g @tmux2k-light-blue '#89dceb'
set -g @tmux2k-blue '#89b4fa'
set -g @tmux2k-dark-blue '#74c7ec'
set -g @tmux2k-light-green '#94e2d5'
set -g @tmux2k-green '#a6e3a1'
set -g @tmux2k-dark-green '#45475a'
set -g @tmux2k-light-orange '#f9e2af'
set -g @tmux2k-yellow '#fab387'
set -g @tmux2k-dark-orange '#eba0ac'
set -g @tmux2k-light-pink '#f2cdcd'
set -g @tmux2k-light-purple '#f5c2e7'
set -g @tmux2k-dark-pink '#cba6f7'
set -g @tmux2k-purple '#cba6f7'
set -g @tmux2k-red '#f38ba8'

run ~/.config/tmux/plugins/2KAbhishek/tmux2k/2k.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-sensible/sensible.tmux

