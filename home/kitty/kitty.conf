# Font Configuration
font_size 12.0
font_family JetBrains Mono

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes
remember_window_size no

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Launch a new window with the same current working window.
map f1 launch --cwd=current --type=os-window

# Set shell; somehow chsh is not picked up.
shell zsh

# Per-OS settings (KITTY_OS is linux, macos or bsd), then per-host overrides.
# Later settings win, so host.conf comes last.
include ${KITTY_OS}.conf
include host.conf
