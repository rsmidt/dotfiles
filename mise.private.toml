# balmorra and ilum

# Not from zypper: templates are rendered before packages get installed.
[tools]
sops = "latest"

[dotfiles]
"~/.config/niri/config.kdl" = "home/niri/config.kdl"

"~/.config/dms/settings.json/shared" = { source = "home/dms/settings.json", merge = true }
# dms 2.0.0's nvim theme reads its settings from here (fixed upstream)
"~/.config/Dux Shell" = { source = "~/.config/dms" }
"~/.config/environment.d/10-mise-shims.conf" = "home/environment.d/10-mise-shims.conf"

"~/.ssh/config/include" = { line = "Include ~/.ssh/config.d/*", position = "prepend" }
"~/.ssh/config.d/10-github" = "home/ssh/config.d/10-github"
"~/.ssh/config.d/20-tailnet" = "home/ssh/config.d/20-tailnet"
"~/.ssh/config.d/30-servers" = { source = "home/ssh/30-servers.tera", mode = "template", permissions = "0600" }

[bootstrap.packages]
"zypper:zsh" = "latest"
"zypper:kitty" = "latest"
"zypper:jetbrains-mono-fonts" = "latest"
"zypper:google-noto-coloremoji-fonts" = "latest"
"zypper:starship" = "latest"
"zypper:fzf" = "latest"
"zypper:ripgrep" = "latest"
"zypper:fd" = "latest"
"zypper:jq" = "latest"
"zypper:git-lfs" = "latest"
"zypper:gpg2" = "latest"
"zypper:age" = "latest"
"zypper:tailscale" = "latest"
"zypper:syncthing" = "latest"
"zypper:nextcloud-desktop" = "latest"
"zypper:MozillaThunderbird" = "latest"
"zypper:niri" = "latest"
"zypper:dms" = "latest"
