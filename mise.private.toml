# balmorra + ilum (private Linux machines on the tailnet).

# sops comes from mise, not zypper: the secret templates call it while mise
# plans a bootstrap, before any packages are installed. `mise x` installs it
# on first use, so a fresh machine needs nothing but mise and the age key.
[tools]
sops = "latest"

[dotfiles]
"~/.config/niri/config.kdl" = "home/niri/config.kdl"

# DMS owns settings.json; this only pins the keys in home/dms/settings.json.
"~/.config/dms/settings.json/shared" = { source = "home/dms/settings.json", merge = true }
# Workaround: dms 2.0.0's Neovim theme reads ~/.config/Dux Shell/settings.json
# (fixed upstream to ~/.config/dms). Remove once the package ships the fix.
"~/.config/Dux Shell" = { source = "~/.config/dms" }
"~/.config/environment.d/10-mise-shims.conf" = "home/environment.d/10-mise-shims.conf"

"~/.ssh/config/include" = { line = "Include ~/.ssh/config.d/*", position = "prepend" }
"~/.ssh/config.d/10-github" = "home/ssh/config.d/10-github"
"~/.ssh/config.d/20-tailnet" = "home/ssh/config.d/20-tailnet"
"~/.ssh/config.d/30-servers" = { source = "home/ssh/30-servers.tera", mode = "template", permissions = "0600" }

"~/.config/immich/auth.yml" = { source = "home/immich/auth.yml.tera", mode = "template", permissions = "0600" }

"~/.config/mise/conf.d/private.toml" = "home/mise/private.toml"

[bootstrap.packages]
"zypper:zsh" = "latest"
"zypper:kitty" = "latest"
"zypper:starship" = "latest"
"zypper:fzf" = "latest"
"zypper:ripgrep" = "latest"
"zypper:fd" = "latest"
"zypper:jq" = "latest"
"zypper:git-lfs" = "latest"
"zypper:gpg2" = "latest"
"zypper:age" = "latest"
"zypper:tailscale" = "latest"
"zypper:syncthing" = "latest"
"zypper:nextcloud-desktop" = "latest"
"zypper:MozillaThunderbird" = "latest"
"zypper:niri" = "latest"
"zypper:dms" = "latest"
